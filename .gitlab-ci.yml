# 三层镜像 CI：同一条流水线、同一个 Dockerfile 构建三个 target，
# 基座层改动天然包含在生产/维护镜像中（结构性继承，无需同步逻辑）
stages:
  - build

build-images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    # ① 基座（仅审计/缓存用途，外部仓库不要 FROM 它）
    - docker build --network host --target base -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-base" .
    # ② 生产（默认镜像，latest 只指向它）
    - docker build --network host --target prod -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    # ③ 维护（排障用，拉取权限应收紧）
    - docker build --network host --target maint -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-maint" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-base"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-maint"
  rules:
    - if: $CI_COMMIT_TAG
