# ═══════════════════════════════════════════════════════════
#  SB Framework 单容器 Nginx 配置（三端口分离）
#  8080 → user-ui + API 代理
#  8081 → admin-ui + API 代理
#  8082 → API 直通
# ═══════════════════════════════════════════════════════════

# 上传请求体通道上限（http 上下文，对三个端口全部生效）
# 必须 >= 应用层 UploadConfig:MaxFileSizeMB，建议再留 20~30% 的
# multipart 编码余量：业务限制 100MB → 设 128m。详见
# sb-framework/docs/AI_Nginx_Upload_Static.md
client_max_body_size 128m;

# ── 用户端 8080 ──
server {
    listen 8080;
    root /app/user-ui;
    index index.html;

    location /user/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 项目特定 API 路由（按需添加，如 /myapp/）
    # location /myapp/ {
    #     proxy_pass http://127.0.0.1:6010;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade           $http_upgrade;
    #     proxy_set_header Connection        "upgrade";
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_read_timeout 86400;
    # }

    location /storage/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── 管理端 8081 ──
server {
    listen 8081;
    root /app/admin-ui;
    index index.html;

    location /admin/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── API 直通 8082 ──
server {
    listen 8082;

    location / {
        proxy_pass http://127.0.0.1:6010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
